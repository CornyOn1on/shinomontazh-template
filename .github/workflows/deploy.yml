# =============================================================================
# Сборка и публикация сайта на GitHub Pages
# =============================================================================
#
# Что делает этот сценарий при каждом push в ветку main
# (в том числе когда контент изменил владелец через Pages CMS):
#
#   1. Забирает код.
#   2. Ставит зависимости (npm ci).
#   3. Проверяет TypeScript (npm run typecheck).
#   4. Определяет базовый путь — с собственным доменом или без.
#   5. Собирает production-версию в папку dist (npm run build).
#   6. Загружает dist как Pages Artifact.
#   7. Публикует сайт через GitHub Pages.
#
# Секреты здесь не нужны: сайт полностью статический, во фронтенде
# нет ни одного токена. Права выданы минимально необходимые (contents: read,
# pages: write, id-token: write — последнее требует сам GitHub Pages).
# =============================================================================

name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только одна публикация.
# Новый запуск отменяет предыдущий незавершённый, но не трогает уже опубликованную версию.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Определяем base-путь для Vite.
      #
      #   - Если в репозитории есть public/CNAME (подключён свой домен),
      #     сайт живёт в корне домена → base = "/".
      #   - Если CNAME нет, GitHub Pages отдаёт сайт по адресу
      #     https://<логин>.github.io/<имя-репозитория>/ → base = "/<имя-репозитория>/".
      #
      # Поэтому при подключении собственного домена достаточно добавить public/CNAME:
      # править vite.config.ts не нужно.
      - name: Determine base path
        id: base
        run: |
          if [ -f "public/CNAME" ]; then
            echo "public/CNAME найден — сайт публикуется в корне собственного домена."
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "public/CNAME не найден — база = /${GITHUB_REPOSITORY#*/}/"
            echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "ОШИБКА: dist/index.html не найден"; exit 1; }
          test -f dist/admin/index.html || { echo "ОШИБКА: dist/admin/index.html не найден"; exit 1; }
          echo "Сборка успешна. Содержимое dist:"
          ls -la dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
